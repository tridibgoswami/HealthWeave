name: E2E & API Tests

on:
  push:
    branches: [main, claude/prompt-optimization-orion-n8dBa]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  test:
    name: Playwright E2E + API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E & API tests
        working-directory: frontend
        env:
          BASE_URL: https://healthweave-yu6rn.ondigitalocean.app
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npx playwright test --reporter=list,html

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()   # upload even on failure so you can see what broke
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload failure screenshots & videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failures
          path: frontend/test-results/
          retention-days: 7
