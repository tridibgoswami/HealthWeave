name: healthweave
region: blr  # Bangalore — keeps Indian health data in India

# ── Backend API ───────────────────────────────────────────────────────────────
services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: backend
    github:
      repo: tridibgoswami/healthweave
      branch: claude/prompt-optimization-orion-n8dBa
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-s   # 1GB RAM — ~$25/month; needed headroom for concurrent OCR (max_tokens=16000)
    routes:
      - path: /api
    health_check:
      http_path: /health
      initial_delay_seconds: 40
      period_seconds: 30
      failure_threshold: 3
    envs:
      # App
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"

      # Database — DO injects this automatically from the managed DB below
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}

      # Security — fill these in the DO dashboard after first deploy
      - key: SECRET_KEY
        type: SECRET
        value: REPLACE_WITH_STRONG_SECRET_MIN_32_CHARS

      # AI keys — fill in DO dashboard
      - key: ANTHROPIC_API_KEY
        type: SECRET
        value: ""
      - key: OPENAI_API_KEY
        type: SECRET
        value: ""

      # AWS S3 — file storage (bucket lives in ap-south-1, not DO Spaces)
      - key: S3_ENDPOINT
        value: https://s3.ap-south-1.amazonaws.com
      - key: S3_REGION
        value: ap-south-1
      - key: S3_BUCKET
        value: healthweave-documents
      - key: S3_ACCESS_KEY
        type: SECRET
        value: ""
      - key: S3_SECRET_KEY
        type: SECRET
        value: ""

      # Email delivery (Resend) — fill RESEND_API_KEY in the DO dashboard
      - key: RESEND_API_KEY
        type: SECRET
        value: ""
      - key: FROM_EMAIL
        value: noreply@healthweave.in
      - key: FROM_NAME
        value: HealthWeave
      - key: APP_BASE_URL
        value: https://app.healthweave.in

      # CORS — allow both the DO-assigned URL and any custom domain
      - key: CORS_ORIGINS
        value: ${frontend.PUBLIC_URL},https://app.healthweave.in

      # Managed Redis — shared rate-limit store (correct across redeploys/instances)
      - key: REDIS_URL
        value: ${redis.DATABASE_URL}

# ── Frontend (React/Vite static site) ────────────────────────────────────────
static_sites:
  - name: frontend
    source_dir: frontend
    github:
      repo: tridibgoswami/healthweave
      branch: claude/prompt-optimization-orion-n8dBa
      deploy_on_push: true
    build_command: npm run build
    output_dir: dist
    index_document: index.html
    error_document: index.html   # SPA — all routes served by index.html
    routes:
      - path: /
    envs:
      - key: VITE_API_URL
        value: ${api.PUBLIC_URL}/api/v1

# ── Managed PostgreSQL ────────────────────────────────────────────────────────
databases:
  - name: db
    engine: PG
    version: "15"
    size: db-s-1vcpu-1gb   # 1GB RAM, 10GB storage — ~$15/month (single-node)
    num_nodes: 1
    production: true        # live with real patient data — enables daily backups + standby

  # ── Managed Redis — shared rate-limit store ───────────────────────────────
  - name: redis
    engine: REDIS
    version: "7"
    size: db-s-1vcpu-1gb   # smallest managed tier — ~$15/month
    num_nodes: 1
    production: false
